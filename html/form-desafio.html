<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario completo - desafio</title>
    <script src="/JS/form-desafio.js" defer></script>
    <style>
        body {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Formulario Completo</h1>
    <p>Preencha com os seus dados.</p>
<br><br>
    <input type="text" id="nome" placeholder="Digite o seu nome" required>
<br><br>
    <input type="email" id="email" placeholder="Digite o seu email" required>
<br><br>
    <input type="password" id="senha" placeholder="Digite sua senha" required>
<br><br>
    <input type="password" id="confirmarSenha" placeholder="Confirme sua senha" required>
<br><br>
    <input type="text" id="idade" placeholder="Digite sua idade" required>
<br><br>
    <button id="cadastrar">CADASTRAR</button>

    <p id="mensagem"></p>

    
</body>
</html>
