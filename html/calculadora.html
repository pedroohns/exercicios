<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora</title>
    <script src="/JS/calculadora.js" defer></script>
    <style>
        body {
            text-align: center;
        }
        button {
            padding: 15px;
        }
    </style>
</head>
<body>
    <h1>CALCULADORA BÁSICA</h1>
    <p>Digite dois numeros na calculadora e faça sua operação:</p>
<br><br>
    <input type="text" id="primeiroNumero" placeholder="Digite o primeiro numero">
<br><br>
    <input type="text" id="segundoNumero" placeholder="Digite o segundo numero">
<br><br>
        <button id="soma">+</button>
        <button id="subtracao">-</button>
        <button id="multiplicacao">x</button>
        <button id="divisao">÷</button>
<br><br>
    <p id="resultado"></p>


</body>
</html>
